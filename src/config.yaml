# Model
model: models/yolo11n.pt
ver: 0.1 beta
ncnn_model_path: models/yolo11n_ncnn_model/

# Camera settings
camera_source: test_video/test.mov # or use 0 for real-time camera
frame_width: 640
frame_height: 480
frame_skip: 5

# Inference settings
imgsz: 640
confidence_threshold: 0.6
draw_bbox: true

# Logging and metadata
location: UCD
camera_id: cam01
logging_enabled: true
log_interval_minutes: 5

# Display settings
refresh_interval_seconds: 30
