# CAMINA sensor daemon configuration — edit per device.
# Only start-up values live here; runtime parameters (intervals, detection
# zone, etc.) are owned by the backend and applied on the fly via
# GET /sensors/{id}/config (see plan/01-windowed-counter-and-ingest.md §3.8).

sensor_id: cam-dub-01
api_base_url: https://camina.ucd.ie/api/ingest
api_token: REPLACE_WITH_PER_DEVICE_BEARER_TOKEN
state_db_path: /var/lib/camina/state.db

fw_version: 0.2.0

classes:
  - person
  - cyclist
  - car
  - e-scooter
  - SUV
  - motorcyclist
  - bus
  - delivery_van
  - truck

# Defaults used until the first successful backend contact.
publish_interval_seconds: 900      # 15 min
heartbeat_interval_seconds: 600    # 10 min
outbox_max_rows: 10000             # ~10 days of 15-min windows + heartbeats

# NCNN inference: CAMINAv1 (TRA 2026 YOLO11n). imgsz must equal the export
# size (see models/camina_v1_yolo11n_ncnn_model/PROVENANCE.md). Ultralytics only
# recognises an NCNN export by the `_ncnn_model` directory suffix.
ncnn_model_path: /opt/camina/models/camina_v1_yolo11n_ncnn_model
imgsz: 640
conf_threshold: 0.3
