# CAMINA sensor configuration — one per device, installed at /etc/camina/sensor.yaml.
# Start-up values only; intervals are then owned by the server and applied via
# GET /sensors/{id}/config (docs/PROTOCOL.md).

sensor_id: cam-dub-01
api_base_url: https://camina.ucd.ie/api/ingest
api_token: REPLACE_WITH_PER_DEVICE_BEARER_TOKEN
state_db_path: /var/lib/camina/state.db

fw_version: 0.2.0

classes:
  - person
  - cyclist
  - car
  - e-scooter
  - SUV
  - motorcyclist
  - bus
  - delivery_van
  - truck

# Defaults used until the first successful backend contact.
publish_interval_seconds: 900      # 15 min
heartbeat_interval_seconds: 900    # 15 min in the pilot (free database); goal 5 min.
                                   # The dashboard's CAMINA_HEARTBEAT_MINUTES wins.
outbox_max_rows: 10000             # ~10 days of 15-min windows + heartbeats

# NCNN inference: CAMINAv1 (TRA 2026 YOLO11n). imgsz must equal the export
# size (see models/camina_v1_yolo11n_ncnn_model/PROVENANCE.md). Ultralytics only
# recognises an NCNN export by the `_ncnn_model` directory suffix.
#
# The committed model is FP32. Its FP16 sibling (half the .bin, same
# detections; useful on a memory-constrained board such as a Pi 4) is
# models/camina_v1_yolo11n_fp16_ncnn_model/ — point this path at it to deploy
# it. Provenance and parity: that directory's PROVENANCE.md.
ncnn_model_path: /opt/camina/models/camina_v1_yolo11n_ncnn_model
imgsz: 640
conf_threshold: 0.3

# Counting (camina/core/counting.py). Each track is counted once, when it
# has travelled; parked cars and street furniture never count.
# - screenline: two points [x, y] in fractions of the frame (0..1). A track is
#   counted when its centre crosses this segment, with direction AB or BA. For
#   a line drawn top to bottom, side A is the left. Draw it across the whole
#   flow (road and pavements) and clear of parked cars; check it with
#   scripts/view_detections.py --screenline.
# - min_move: a track must also have moved this many of its own box heights
#   from where it was first seen (both modes), so jitter on the line never counts.
# screenline: [[0.65, 0.15], [0.65, 0.85]]
min_move: 1.0

# Tracking (camina/core/tracker.py).
max_occlusion_s: 5.0   # seconds a hidden road user keeps its track (any frame rate)
min_class_hits: 3      # detections of its winning class before a track counts under it
relink: false          # re-link a track after an occlusion: off, it doubled the error on
                       # the hand-counted clip (docs/benchmarks/2026-09-27_tracker_occlusion.md)

# Speed (camina/core/speed.py). Off unless this block is present; without it
# the payload's avg_speed_kmh stays empty. Calibrate per site first:
# docs/CALIBRATION_SETUP.md. Not yet validated against a reference speed.
# - line_a, line_b: two lines across the road, [x, y] in fractions of the frame,
#   both drawn in the same orientation (e.g. both top to bottom), at the two
#   marks on the road.
# - distance_m: ground distance between the two marks along the road, metres.
# - max_kmh: faster measurements are rejected as implausible (default 150).
# A track timed from one line to the other gives distance_m / time; the
# window publishes each class's mean over its timed tracks.
# speed:
#   line_a: [[0.30, 0.20], [0.30, 0.90]]
#   line_b: [[0.70, 0.20], [0.70, 0.90]]
#   distance_m: 20.0
#   max_kmh: 150
