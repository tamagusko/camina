# CAMINA Pipeline Configuration File
# Customize these settings for your specific environment and requirements

pipeline:
  # Dataset paths
  sdl_dataset_path: "datasets/SDL fine-tuned_v3-cyclist_cleaned"
  output_dataset_path: "all_camina_classes"
  
  # Model configuration
  base_model: "yolo11n.pt"
  epochs: 100
  batch_size: 16
  device: "auto"  # auto, cpu, cuda, mps
  
  # Model comparison settings
  models_to_compare:
    - "yolov8n"
    - "yolo11n"
    # - "yolov5n"    # Uncomment to include
    # - "yolov10n"   # Uncomment to include
    # - "yolo12n"    # Uncomment when available
  
  # Video for benchmarking (optional)
  test_video_path: null  # Will create synthetic video if null
  
  # Export formats for Raspberry Pi deployment
  export_formats:
    - "ncnn"
    - "onnx"
    # - "tflite"  # Uncomment if needed
  
  # Cleanup temporary files after testing
  cleanup_after_test: false

testing:
  # Quick test settings (for development/debugging)
  quick_test_epochs: 3
  test_batch_size: 4
  
  # Test options
  create_test_video: true
  run_memory_profiling: true
  validate_outputs: true
  run_benchmarks: true
  
  # Timeout settings (seconds)
  command_timeout: 3600
  training_timeout: 7200

output:
  # Output directories
  results_dir: "pipeline_results"
  logs_dir: "pipeline_logs"
  
  # Output options
  save_intermediate: true
  create_report: true
  
  # Visualization settings
  create_plots: true
  save_model_graphs: true

# Advanced settings
advanced:
  # Parallel processing
  max_workers: 4
  use_multiprocessing: false
  
  # Memory management
  max_memory_gb: 8
  enable_memory_monitoring: true
  
  # Error handling
  retry_failed_steps: 1
  continue_on_error: false
  
  # Logging
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_detailed_logs: true
  
  # Security
  validate_inputs: true
  sanitize_paths: true

# Raspberry Pi 5 specific settings
raspberry_pi:
  # Hardware specifications
  cpu_cores: 4
  ram_gb: 8
  gpu_memory_mb: 128
  
  # Performance targets
  target_fps: 15
  max_inference_time_ms: 100
  max_memory_usage_mb: 1000
  
  # Optimization settings
  use_vulkan: true
  enable_quantization: true
  optimize_for_size: true
  
  # Deployment settings
  create_installation_script: true
  include_dependencies: true
  create_systemd_service: false