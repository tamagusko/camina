# CAMINA Quick Test Configuration
# Optimized for fast testing and debugging

# Dataset configuration
dataset:
  sdl_dataset_path: "datasets/SDL fine-tuned_v3-cyclist_cleaned"
  output_dataset_path: "datasets/camina_9class_test"
  train_split: 0.8
  val_split: 0.2
  test_split: 0.0  # Skip test split for quick testing
  min_samples_per_class: 10  # Reduced for testing

# Video processing configuration
video_processing:
  extraction_fps: 2.0  # Higher FPS for more frames quickly
  output_format: "jpg"
  quality: 80  # Lower quality for speed
  max_frames_per_video: 50  # Very limited frames
  frame_size: [416, 416]  # Smaller image size

# Training configuration - optimized for speed
training:
  model_name: "yolo11n.pt"
  epochs: 5  # Very few epochs for quick testing
  batch_size: 4  # Small batch size
  image_size: 416  # Smaller image size for speed
  device: "auto"
  workers: 2  # Fewer workers
  patience: 3  # Short patience
  learning_rate: 0.01  # Higher learning rate
  weight_decay: 0.0001
  optimizer: "SGD"  # SGD is often faster than AdamW
  
  # Minimal augmentation for speed
  mosaic: 0.5
  mixup: 0.0
  copy_paste: 0.0
  flipud: 0.0
  fliplr: 0.3
  degrees: 0.0
  translate: 0.05
  scale: 0.95
  perspective: 0.0
  hsv_h: 0.01
  hsv_s: 0.3
  hsv_v: 0.2

# Auto-labeling configuration
auto_labeling:
  confidence_threshold: 0.5  # Higher threshold for fewer detections
  nms_threshold: 0.5
  min_box_size: 0.02
  max_detections: 50  # Fewer detections
  
  clip_prompts:
    6: ["electric scooter"]  # Simplified prompts
    7: ["SUV"]
    8: ["delivery van"]

# Deployment configuration
deployment:
  target_device: "cpu"  # CPU for compatibility
  export_formats: ["onnx"]  # Single format
  quantization: false  # Skip quantization for speed
  optimization: false  # Skip optimization
  max_memory_mb: 500
  target_fps: 5  # Lower FPS target

# Advanced settings
advanced:
  max_workers: 2
  use_multiprocessing: false
  max_memory_gb: 4
  enable_memory_monitoring: false  # Skip monitoring
  retry_failed_steps: 0  # No retries
  continue_on_error: true  # Continue despite errors
  log_level: "WARNING"  # Less verbose logging
  save_detailed_logs: false
  validate_inputs: false  # Skip validation for speed
  sanitize_paths: false

# Output configuration
output:
  results_dir: "test_results"
  logs_dir: "test_logs"
  save_intermediate: false  # Don't save intermediate results
  create_report: true
  create_plots: false  # Skip plots for speed
  save_model_graphs: false