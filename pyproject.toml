[project]
name = "camina"
version = "0.2.0"
description = "Privacy-first traffic sensor: counts road users on a Raspberry Pi 5, publishes only counts."
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dashboard", "training/dataset"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["camina", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
